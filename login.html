<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VARG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background-image: radial-gradient(circle at center, rgba(0,191,255,0.08), transparent 35%); }
    .login-container { width: 100%; max-width: 420px; background: rgba(20,20,20,0.95); border: 1px solid #222; border-radius: 16px; padding: 35px 30px; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
    .logo-title { text-align: center; margin-bottom: 30px; }
    .logo-title h1 { font-size: 2.2rem; margin-bottom: 8px; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px rgba(0,191,255,0.35); }
    .logo-title p { color: #bbb; font-size: 0.95rem; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #ddd; }
    .input-box { position: relative; }
    .input-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #00BFFF; }
    .input-box input { width: 100%; padding: 14px 14px 14px 42px; border: 1px solid #333; border-radius: 10px; background: #111; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    .input-box input:focus { border-color: #00BFFF; box-shadow: 0 0 10px rgba(0,191,255,0.2); }
    .login-btn { width: 100%; background: #DC143C; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .login-btn:hover { background: #b01030; box-shadow: 0 0 15px rgba(220,20,60,0.3); }
    .extra-links { margin-top: 20px; text-align: center; }
    .extra-links a { color: #00BFFF; text-decoration: none; font-size: 0.95rem; }
    .extra-links a:hover { color: #fff; }
    .divider { margin: 20px 0; border-top: 1px solid #222; }
    .register-text { text-align: center; color: #aaa; font-size: 0.95rem; }
    .register-text a { color: #DC143C; text-decoration: none; font-weight: bold; }
    .register-text a:hover { color: #fff; }
    .erro { color: #ff4d4d; text-align: center; margin-top: 12px; font-size: 0.9rem; display: none; }
  </style>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--red:#DC143C;--red2:#b01030}
header.slim{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.97);border-bottom:3px solid var(--red);box-shadow:0 2px 20px rgba(220,20,60,.2)}
.slim-inner{max-width:1200px;margin:0 auto;padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.slim-logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.slim-logo img{height:36px;width:36px;object-fit:contain;filter:brightness(1.8) contrast(1.3)}
.slim-logo span{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.04em;color:#DC143C;line-height:1;white-space:nowrap}
.slim-right{display:flex;align-items:center;gap:10px}
.slim-back{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:#aaa;text-decoration:none;padding:5px 10px;border-radius:6px;transition:all .2s;white-space:nowrap}
.slim-back:hover{color:#fff;background:rgba(255,255,255,.07)}
body{padding-top:59px}
</style>

<style>header:not(.slim){display:none!important}body{padding-top:59px!important}</style>

<style>
.slim-cart-btn{position:relative;background:none;border:1px solid #333;border-radius:10px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:#ccc;transition:all .2s;white-space:nowrap}
.slim-cart-btn:hover{border-color:#DC143C;color:#DC143C}
.slim-cart-count{background:#DC143C;color:#fff;border-radius:50%;width:18px;height:18px;font-size:.6rem;font-weight:800;display:none;align-items:center;justify-content:center;margin-left:2px}
.slim-cart-count.show{display:flex}
/* CART DRAWER */
.slim-cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.slim-cart-overlay.open{opacity:1;pointer-events:all}
.slim-cart-drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:95vw;background:#111;z-index:2001;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.5)}
.slim-cart-drawer.open{transform:translateX(0)}
.slim-cart-head{padding:18px 22px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between}
.slim-cart-head h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.3rem;text-transform:uppercase;color:#fff}
.slim-cart-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888;line-height:1}
.slim-cart-close:hover{color:#DC143C}
.slim-cart-items{flex:1;overflow-y:auto;padding:14px 22px}
.slim-cart-foot{padding:18px 22px;border-top:1px solid #333;background:#0f0f0f}
.slim-cart-total-row{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:#fff;margin-bottom:14px}
.slim-cart-total-row span:last-child{color:#DC143C}
.slim-btn-checkout{display:block;width:100%;padding:13px;background:#DC143C;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;transition:.2s}
.slim-btn-checkout:hover{background:#b01030}
.slim-btn-limpar{display:block;text-align:center;margin-top:8px;font-size:.8rem;color:#555;cursor:pointer;background:none;border:none;text-decoration:underline}
.slim-btn-limpar:hover{color:#DC143C}
</style>

<style>
/* MOBILE SLIM */
@media(max-width:768px){
  .slim-inner{padding:0 10px;gap:6px}
  .slim-back{display:none}
  .slim-right{gap:6px}
}
/* SLIM MOBILE MENU */
.slim-mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998}
.slim-mob-overlay.open{display:block}
.slim-mob-menu{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:290px;background:#0f0f0f;border-right:2px solid #DC143C;z-index:9999;padding:72px 18px 24px;overflow-y:auto;transform:translateX(-110%);transition:transform .3s ease;visibility:hidden}
.slim-mob-menu.open{transform:translateX(0);visibility:visible}
.slim-mob-menu a{display:block;padding:12px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;color:#eee;text-decoration:none;border-bottom:1px solid #1a1a1a;letter-spacing:.04em;text-transform:uppercase}
.slim-mob-menu a:hover{color:#DC143C}
.slim-mob-auth{display:flex;gap:8px;margin-top:14px}
.slim-mob-auth a{padding:10px 14px;border-radius:28px;text-align:center;flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;text-decoration:none;border:none}
.slim-mob-auth .sm-login{border:1px solid #333!important;color:#eee!important;background:none}
.slim-mob-auth .sm-reg{background:#DC143C;color:#fff!important}
/* HAMBURGER SLIM */
.slim-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:5px}
.slim-hamburger span{display:block;width:20px;height:2px;background:#fff;border-radius:2px;transition:all .3s}
.slim-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.slim-hamburger.open span:nth-child(2){opacity:0}
.slim-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:768px){.slim-hamburger{display:flex!important}}
@media(min-width:769px){.slim-hamburger{display:none!important}}
</style>
</head>
<body>

<!-- SLIM CART DRAWER -->
<div class="slim-cart-overlay" id="slimCartOverlay" onclick="slimFecharCart()"></div>
<div class="slim-cart-drawer" id="slimCartDrawer">
  <div class="slim-cart-head">
    <h2>Carrinho</h2>
    <button class="slim-cart-close" onclick="slimFecharCart()">✕</button>
  </div>
  <div class="slim-cart-items" id="slimCartItems"></div>
  <div class="slim-cart-foot" id="slimCartFoot" style="display:none">
    <div class="slim-cart-total-row"><span>Total</span><span id="slimCartTotal">R$ 0,00</span></div>
    <a href="/checkout.html" class="slim-btn-checkout">Finalizar Pedido</a>
    <button class="slim-btn-limpar" onclick="slimLimparCart()">Limpar carrinho</button>
  </div>
</div>
<header class="slim">
  <div class="slim-inner">
    <button class="slim-hamburger" id="slimHamburger" onclick="slimToggleMob()"><span></span><span></span><span></span></button>
    <a href="/index.html" class="slim-logo">
      <img src="/img/lobovinho-removebg-preview.png" alt="VARG"/>
      <span>VARG</span>
    </a>
            <div class="slim-right" style="display:flex;align-items:center;gap:8px;">
      <a href="/index.html" class="slim-back" data-i18n="nav.home">← Loja</a>
      <button class="slim-cart-btn" onclick="slimAbrirCart()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/></svg>
        Carrinho
        <span class="slim-cart-count" id="slimCartBadge">0</span>
      </button>
      <div id="slimAuthArea" style="display:flex;align-items:center;gap:6px;"></div>
    </div>
  </div>
</header>
<script src="/i18n.js"></script>
<script src="/i18n-init.js"></script>

  <div class="login-container">
    <div class="logo-title">
      <h1>VARG</h1>
      <p>Acesse sua conta</p>
    </div>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">E-mail</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Digite seu e-mail" required>
        </div>
      </div>
      <div class="input-group">
        <label for="senha">Senha</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>
      </div>
      <button type="submit" class="login-btn">Entrar</button>
      <p class="erro" id="erroMsg"></p>
    </form>
    <div class="extra-links"><a href="#" id="linkEsqueceuSenha">Esqueci minha senha</a></div>
    <div class="divider"></div>
    <div class="register-text">Não tem conta? <a href="/cadastro.html">Criar cadastro</a></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const erroMsg = document.getElementById('erroMsg');
      erroMsg.style.display = 'none';
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await response.json();
        if (data.success) {
          if (data.token) localStorage.setItem("varg_token", data.token);
          localStorage.setItem('usuarioNome', data.nome);
          localStorage.setItem('usuarioEmail', email);
          const redirect = localStorage.getItem('redirectAposLogin');
          localStorage.removeItem('redirectAposLogin');
          window.location.href = redirect ? '/' + redirect : '/index.html';
        } else {
          erroMsg.textContent = data.message || 'E-mail ou senha incorretos.';
          erroMsg.style.display = 'block';
        }
      } catch (error) {
        erroMsg.textContent = 'Erro ao conectar com o servidor.';
        erroMsg.style.display = 'block';
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      // Exibe mensagem vinda do checkout
      const mensagem = localStorage.getItem('mensagemLogin');
      if (mensagem) {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(0,191,255,0.1);border:1px solid #00BFFF;color:#00BFFF;padding:12px 16px;border-radius:10px;text-align:center;font-size:0.9rem;margin-bottom:20px;';
        div.textContent = mensagem;
        document.querySelector('.login-container').insertBefore(div, document.querySelector('.logo-title').nextSibling);
        localStorage.removeItem('mensagemLogin');
      }

    document.getElementById('linkEsqueceuSenha').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('modalEsqueceuSenha').style.display = 'flex';
    });

    document.getElementById('btnEnviarReset').addEventListener('click', async function() {
      const email = document.getElementById('emailReset').value.trim();
      const msg = document.getElementById('msgReset');
      msg.style.display = 'none';

      if (!email) { msg.textContent = 'Digite seu e-mail.'; msg.style.color = '#ff4d4d'; msg.style.display = 'block'; return; }

      this.disabled = true;
      this.textContent = 'Enviando...';

      try {
        const res = await fetch('/esqueci-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.textContent = data.message;
        msg.style.color = data.success ? '#00ff88' : '#ff4d4d';
        msg.style.display = 'block';
        if (data.success) {
          if (data.token) localStorage.setItem("varg_token", data.token);
          this.textContent = 'Enviado!';
        } else {
          this.disabled = false;
          this.textContent = 'Enviar Link';
        }
      } catch(err) {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.style.color = '#ff4d4d';
        msg.style.display = 'block';
        this.disabled = false;
        this.textContent = 'Enviar Link';
      }
    });

    document.getElementById('fecharModalReset').addEventListener('click', function() {
      document.getElementById('modalEsqueceuSenha').style.display = 'none';
    });

    }); // end DOMContentLoaded
  </script>

  <!-- MODAL ESQUECI SENHA -->
  <div id="modalEsqueceuSenha" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:#141414;border:1px solid #333;border-radius:16px;padding:35px 30px;width:90%;max-width:400px;position:relative;">
      <button id="fecharModalReset" style="position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;">&times;</button>
      <h3 style="color:#DC143C;margin-bottom:8px;font-size:1.3rem;">Esqueci minha senha</h3>
      <p style="color:#aaa;font-size:0.9rem;margin-bottom:20px;">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
      <input id="emailReset" type="email" placeholder="Seu e-mail" style="width:100%;padding:12px 14px;background:#111;border:1px solid #333;border-radius:10px;color:#fff;font-size:1rem;outline:none;margin-bottom:12px;" />
      <button id="btnEnviarReset" style="width:100%;background:#DC143C;color:#fff;border:none;padding:12px;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;">Enviar Link</button>
      <p id="msgReset" style="display:none;margin-top:12px;font-size:0.9rem;text-align:center;"></p>
    </div>
  </div>

<script>
function slimAbrirCart(){document.getElementById('slimCartDrawer').classList.add('open');document.getElementById('slimCartOverlay').classList.add('open');document.body.style.overflow='hidden';slimRenderCart();}
function slimFecharCart(){document.getElementById('slimCartDrawer').classList.remove('open');document.getElementById('slimCartOverlay').classList.remove('open');document.body.style.overflow='';}
function slimLimparCart(){localStorage.removeItem('carrinho');slimRenderCart();}
function slimChgQty(nome,d){var c=JSON.parse(localStorage.getItem('carrinho')||'[]');var i=c.find(function(x){return x.nome===nome;});if(i){i.quantidade+=d;if(i.quantidade<=0)c=c.filter(function(x){return x.nome!==nome;});}localStorage.setItem('carrinho',JSON.stringify(c));slimRenderCart();}
function slimRmItem(nome){var c=JSON.parse(localStorage.getItem('carrinho')||'[]').filter(function(x){return x.nome!==nome;});localStorage.setItem('carrinho',JSON.stringify(c));slimRenderCart();}
function slimRenderCart(){
  var items=document.getElementById('slimCartItems');
  var foot=document.getElementById('slimCartFoot');
  var badge=document.getElementById('slimCartBadge');
  var cart=JSON.parse(localStorage.getItem('carrinho')||'[]');
  if(!cart.length){
    if(items) items.innerHTML='<p style="color:#555;text-align:center;padding:40px 0;font-size:.9rem">Carrinho vazio.</p>';
    if(foot) foot.style.display='none';
    if(badge) badge.classList.remove('show');
    return;
  }
  var total=0,html='<div style="display:flex;flex-direction:column;gap:12px">';
  cart.forEach(function(item){
    var sub=item.preco*item.quantidade; total+=sub;
    html+='<div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;padding-bottom:12px">'
      +'<img src="'+item.img+'" style="width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid #333">'
      +'<div style="flex:1;min-width:0"><div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:.9rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+item.nome+'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'
      +'<button onclick="slimChgQty(\''+item.nome.replace(/'/g,"\'")+'\', -1)" style="background:#333;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.85rem">−</button>'
      +'<span style="color:#fff;font-size:.88rem">'+item.quantidade+'</span>'
      +'<button onclick="slimChgQty(\''+item.nome.replace(/'/g,"\'")+'\', 1)" style="background:#333;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.85rem">+</button>'
      +'<button onclick="slimRmItem(\''+item.nome.replace(/'/g,"\'")+'\');" style="background:none;border:none;color:#555;cursor:pointer;margin-left:auto;font-size:.9rem">🗑</button>'
      +'</div>'
      +'<span style="color:#DC143C;font-weight:700;font-size:.82rem;font-family:\'Barlow Condensed\',sans-serif">R$ '+sub.toFixed(2).replace('.',',')+'</span>'
      +'</div></div>';
  });
  html+='</div>';
  if(items) items.innerHTML=html;
  if(document.getElementById('slimCartTotal')) document.getElementById('slimCartTotal').textContent='R$ '+total.toFixed(2).replace('.',',');
  if(foot) foot.style.display='';
  if(badge){badge.textContent=cart.reduce(function(a,i){return a+i.quantidade;},0);badge.classList.add('show');}
}
document.addEventListener('DOMContentLoaded', slimRenderCart);
</script>

<script>
(function waitAuth() {
  // Espera i18n carregar
  function renderAuth() {
    var nome = localStorage.getItem('usuarioNome');
    var lang = (window.PEP_LANG && window.PEP_LANG.get()) || localStorage.getItem('varg_lang') || 'pt';
    var dict = window.PEPMASTERS_I18N || {};
    var t = function(k) { return (dict[k] && (dict[k][lang] || dict[k]['pt'] || dict[k]['en'])) || k; };

    // ---- AUTH AREA (desktop) ----
    var a = document.getElementById('hdrAuthArea') || document.getElementById('slimAuthArea');
    if (a) {
      var s = "font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;text-transform:uppercase;text-decoration:none;white-space:nowrap;padding:4px 7px;border-radius:6px;transition:.2s;";
      if (nome) {
        a.innerHTML =
          '<a href="/meus-pedidos.html" style="' + s + 'color:#ccc;" onmouseover="this.style.color=\'#DC143C\'" onmouseout="this.style.color=\'#ccc\'">' + t('nav.orders') + '</a>' +
          '<a href="#" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.href=\'/index.html\';" style="' + s + 'color:#DC143C;">' + t('nav.logout') + '</a>';
      } else {
        a.innerHTML =
          '<a href="/login.html" style="' + s + 'color:#DC143C;border:1px solid #DC143C;border-radius:8px;">' + t('nav.login') + '</a>' +
          '<a href="/cadastro.html" style="' + s + 'background:#DC143C;color:#fff;border-radius:8px;">' + t('nav.register') + '</a>';
      }
    }

    // ---- AUTH AREA (index desktop) ----
    var a2 = document.getElementById('authArea');
    if (a2) {
      var s2 = "font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;text-transform:uppercase;text-decoration:none;white-space:nowrap;padding:4px 7px;border-radius:6px;transition:.2s;";
      if (nome) {
        a2.innerHTML =
          '<a href="/meus-pedidos.html" style="' + s2 + 'color:#ccc;" onmouseover="this.style.color=\'#DC143C\'" onmouseout="this.style.color=\'#ccc\'">' + t('nav.orders') + '</a>' +
          '<a href="#" id="btnSair" style="' + s2 + 'color:#DC143C;">' + t('nav.logout') + '</a>';
        var bs = document.getElementById('btnSair');
        if (bs) bs.onclick = function(e) { e.preventDefault(); localStorage.removeItem('usuarioNome'); localStorage.removeItem('usuarioEmail'); window.location.reload(); };
      } else {
        a2.innerHTML =
          '<a href="/login.html" class="btn-login" style="' + s2 + '">' + t('nav.login') + '</a>' +
          '<a href="/cadastro.html" class="btn-cadastro" style="' + s2 + '">' + t('nav.register') + '</a>';
      }
    }

    // ---- MOBILE AUTH (index) ----
    var m = document.getElementById('mobileAuth');
    if (m) {
      if (nome) {
        m.innerHTML =
          '<a href="/meus-pedidos.html" class="btn-login">' + t('nav.orders') + '</a>' +
          '<a href="#" class="btn-cadastro" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.reload();">' + t('nav.logout') + '</a>';
      } else {
        m.innerHTML =
          '<a href="/login.html" class="btn-login">' + t('nav.login') + '</a>' +
          '<a href="/cadastro.html" class="btn-cadastro">' + t('nav.register') + '</a>';
      }
    }

    // ---- SLIM MOBILE AUTH (páginas secundárias) ----
    var sm = document.getElementById('slimMobAuth');
    if (sm) {
      if (nome) {
        sm.innerHTML =
          '<a href="/meus-pedidos.html" class="sm-login">' + t('nav.orders') + '</a>' +
          '<a href="#" class="sm-reg" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.href=\'/index.html\';">' + t('nav.logout') + '</a>';
      } else {
        sm.innerHTML = '<a href="/login.html" class="sm-login">' + t('nav.login') + '</a><a href="/cadastro.html" class="sm-reg">' + t('nav.register') + '</a>';
      }
    }

    // ← Loja traduzido
    document.querySelectorAll('.slim-back').forEach(function(el) {
      el.textContent = '← ' + t('nav.home');
    });
  }

  // Aguarda dicionário i18n
  if (window.PEPMASTERS_I18N) {
    renderAuth();
  } else {
    var tries = 0;
    var iv = setInterval(function() {
      tries++;
      if (window.PEPMASTERS_I18N) { clearInterval(iv); renderAuth(); }
      else if (tries > 40) clearInterval(iv);
    }, 50);
  }

  // Reaplica quando idioma muda
  document.addEventListener('vargLangChanged', renderAuth);
document.addEventListener('vargLangChanged', function() { if(window.PEP_LANG_APPLY) window.PEP_LANG_APPLY(); });
})();
</script>
</body>
</html>
