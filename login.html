<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VARG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background-image: radial-gradient(circle at center, rgba(0,191,255,0.08), transparent 35%); }
    .login-container { width: 100%; max-width: 420px; background: rgba(20,20,20,0.95); border: 1px solid #222; border-radius: 16px; padding: 35px 30px; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
    .logo-title { text-align: center; margin-bottom: 30px; }
    .logo-title h1 { font-size: 2.2rem; margin-bottom: 8px; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px rgba(0,191,255,0.35); }
    .logo-title p { color: #bbb; font-size: 0.95rem; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #ddd; }
    .input-box { position: relative; }
    .input-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #00BFFF; }
    .input-box input { width: 100%; padding: 14px 14px 14px 42px; border: 1px solid #333; border-radius: 10px; background: #111; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    .input-box input:focus { border-color: #00BFFF; box-shadow: 0 0 10px rgba(0,191,255,0.2); }
    .login-btn { width: 100%; background: #DC143C; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .login-btn:hover { background: #b01030; box-shadow: 0 0 15px rgba(220,20,60,0.3); }
    .extra-links { margin-top: 20px; text-align: center; }
    .extra-links a { color: #00BFFF; text-decoration: none; font-size: 0.95rem; }
    .extra-links a:hover { color: #fff; }
    .divider { margin: 20px 0; border-top: 1px solid #222; }
    .register-text { text-align: center; color: #aaa; font-size: 0.95rem; }
    .register-text a { color: #DC143C; text-decoration: none; font-weight: bold; }
    .register-text a:hover { color: #fff; }
    .erro { color: #ff4d4d; text-align: center; margin-top: 12px; font-size: 0.9rem; display: none; }
  </style>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--red:#DC143C;--red2:#b01030}
header.slim{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.97);border-bottom:3px solid var(--red);box-shadow:0 2px 20px rgba(220,20,60,.2)}
.slim-inner{max-width:1200px;margin:0 auto;padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.slim-logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.slim-logo img{height:36px;width:36px;object-fit:contain;filter:brightness(1.8) contrast(1.3)}
.slim-logo span{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.04em;color:#DC143C;line-height:1;white-space:nowrap}
.slim-right{display:flex;align-items:center;gap:10px}
.slim-back{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:#aaa;text-decoration:none;padding:5px 10px;border-radius:6px;transition:all .2s;white-space:nowrap}
.slim-back:hover{color:#fff;background:rgba(255,255,255,.07)}
body{padding-top:59px}
</style>

<style>header:not(.slim){display:none!important}body{padding-top:59px!important}</style>
</head>
<body>
<header class="slim">
  <div class="slim-inner">
    <a href="/index.html" class="slim-logo">
      <img src="/img/lobovinho-removebg-preview.png" alt="VARG"/>
      <span>VARG</span>
    </a>
    <div class="slim-right">
      <a href="/index.html" class="slim-back" data-i18n="nav.home">← Loja</a>
    </div>
  </div>
</header>
<script src="/i18n.js"></script>
<script src="/i18n-init.js"></script>

  <div class="login-container">
    <div class="logo-title">
      <h1>VARG</h1>
      <p>Acesse sua conta</p>
    </div>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">E-mail</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Digite seu e-mail" required>
        </div>
      </div>
      <div class="input-group">
        <label for="senha">Senha</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>
      </div>
      <button type="submit" class="login-btn">Entrar</button>
      <p class="erro" id="erroMsg"></p>
    </form>
    <div class="extra-links"><a href="#" id="linkEsqueceuSenha">Esqueci minha senha</a></div>
    <div class="divider"></div>
    <div class="register-text">Não tem conta? <a href="/cadastro.html">Criar cadastro</a></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const erroMsg = document.getElementById('erroMsg');
      erroMsg.style.display = 'none';
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await response.json();
        if (data.success) {
          if (data.token) localStorage.setItem("varg_token", data.token);
          localStorage.setItem('usuarioNome', data.nome);
          localStorage.setItem('usuarioEmail', email);
          const redirect = localStorage.getItem('redirectAposLogin');
          localStorage.removeItem('redirectAposLogin');
          window.location.href = redirect ? '/' + redirect : '/index.html';
        } else {
          erroMsg.textContent = data.message || 'E-mail ou senha incorretos.';
          erroMsg.style.display = 'block';
        }
      } catch (error) {
        erroMsg.textContent = 'Erro ao conectar com o servidor.';
        erroMsg.style.display = 'block';
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      // Exibe mensagem vinda do checkout
      const mensagem = localStorage.getItem('mensagemLogin');
      if (mensagem) {
        const div = document.createElement('div');
        div.style.cssText = 'background:rgba(0,191,255,0.1);border:1px solid #00BFFF;color:#00BFFF;padding:12px 16px;border-radius:10px;text-align:center;font-size:0.9rem;margin-bottom:20px;';
        div.textContent = mensagem;
        document.querySelector('.login-container').insertBefore(div, document.querySelector('.logo-title').nextSibling);
        localStorage.removeItem('mensagemLogin');
      }

    document.getElementById('linkEsqueceuSenha').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('modalEsqueceuSenha').style.display = 'flex';
    });

    document.getElementById('btnEnviarReset').addEventListener('click', async function() {
      const email = document.getElementById('emailReset').value.trim();
      const msg = document.getElementById('msgReset');
      msg.style.display = 'none';

      if (!email) { msg.textContent = 'Digite seu e-mail.'; msg.style.color = '#ff4d4d'; msg.style.display = 'block'; return; }

      this.disabled = true;
      this.textContent = 'Enviando...';

      try {
        const res = await fetch('/esqueci-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.textContent = data.message;
        msg.style.color = data.success ? '#00ff88' : '#ff4d4d';
        msg.style.display = 'block';
        if (data.success) {
          if (data.token) localStorage.setItem("varg_token", data.token);
          this.textContent = 'Enviado!';
        } else {
          this.disabled = false;
          this.textContent = 'Enviar Link';
        }
      } catch(err) {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.style.color = '#ff4d4d';
        msg.style.display = 'block';
        this.disabled = false;
        this.textContent = 'Enviar Link';
      }
    });

    document.getElementById('fecharModalReset').addEventListener('click', function() {
      document.getElementById('modalEsqueceuSenha').style.display = 'none';
    });

    }); // end DOMContentLoaded
  </script>

  <!-- MODAL ESQUECI SENHA -->
  <div id="modalEsqueceuSenha" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:#141414;border:1px solid #333;border-radius:16px;padding:35px 30px;width:90%;max-width:400px;position:relative;">
      <button id="fecharModalReset" style="position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;">&times;</button>
      <h3 style="color:#DC143C;margin-bottom:8px;font-size:1.3rem;">Esqueci minha senha</h3>
      <p style="color:#aaa;font-size:0.9rem;margin-bottom:20px;">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
      <input id="emailReset" type="email" placeholder="Seu e-mail" style="width:100%;padding:12px 14px;background:#111;border:1px solid #333;border-radius:10px;color:#fff;font-size:1rem;outline:none;margin-bottom:12px;" />
      <button id="btnEnviarReset" style="width:100%;background:#DC143C;color:#fff;border:none;padding:12px;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;">Enviar Link</button>
      <p id="msgReset" style="display:none;margin-top:12px;font-size:0.9rem;text-align:center;"></p>
    </div>
  </div>
</body>
</html>
