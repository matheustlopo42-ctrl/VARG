<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — VARG</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/varg.css">
</head>
<body>
<div id="topo"></div>
<main class="auth-wrap">
  <form class="auth-card" id="form" novalidate>
    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta para comprar e acompanhar seus pedidos.</p>
    <div id="msg"></div>
    <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="senha" style="display:flex;justify-content:space-between">Senha <a href="/esqueci-senha.html" class="link-btn">Esqueci minha senha</a></label><input class="input" id="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" id="btn" type="submit">Entrar</button>
    <p class="foot">Ainda não tem conta? <a href="#" id="linkCadastro">Criar conta</a></p>
  </form>
</main>
<div id="rodape"></div>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-loja.js"></script>
<script src="/js/app.js"></script>
<script src="/js/i18n-init.js"></script>
<script>
(function () {
  var V = VARG, voltar = V.param("voltar") || "/conta.html";
  if (!/^\/[^\/]/.test(voltar)) voltar = "/conta.html";
  if (V.Sessao.token()) { location.href = voltar; return; }
  document.getElementById("linkCadastro").href = "/cadastro.html?voltar=" + encodeURIComponent(voltar);
  if (V.param("motivo") === "checkout") document.getElementById("msg").innerHTML = '<div class="alert alert-info">Entre ou crie sua conta para finalizar a compra.</div>';
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var btn = document.getElementById("btn"); V.carregando(btn, true);
    V.api("/api/auth/login", { body: { email: email.value, senha: senha.value } })
      .then(function (d) { V.Sessao.salvar(d.token, d.usuario); location.href = voltar; })
      .catch(function (err) { document.getElementById("msg").innerHTML = '<div class="alert alert-error">' + V.esc(err.message) + "</div>"; V.carregando(btn, false); });
  };
})();
</script>
</body>
</html>
