<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova senha — VARG</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/lobovinho-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/varg.css">
</head>
<body>
<div id="topo"></div>
<main class="auth-wrap">
  <form class="auth-card" id="form" novalidate>
    <h1>Nova senha</h1>
    <p class="sub">Escolha uma nova senha para sua conta.</p>
    <div id="msg"></div>
    <div class="field"><label for="senha">Nova senha <span class="dim">(mínimo 8 caracteres)</span></label><input class="input" id="senha" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="senha2">Repita a nova senha</label><input class="input" id="senha2" type="password" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-block" id="btn" type="submit">Salvar nova senha</button>
  </form>
</main>
<div id="rodape"></div>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-loja.js"></script>
<script src="/js/app.js"></script>
<script src="/js/i18n-init.js"></script>
<script>
(function () {
  var V = VARG, token = V.param("token"), msg = document.getElementById("msg");
  if (!token) msg.innerHTML = '<div class="alert alert-error">Link inválido. <a href="/esqueci-senha.html" style="text-decoration:underline">Peça um novo</a>.</div>';
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    if (senha.value !== senha2.value) { msg.innerHTML = '<div class="alert alert-error">As senhas não são iguais.</div>'; return; }
    var btn = document.getElementById("btn"); V.carregando(btn, true);
    V.api("/api/auth/redefinir-senha", { body: { token: token, senha: senha.value } })
      .then(function () { msg.innerHTML = '<div class="alert alert-ok">Senha alterada! Redirecionando para o login...</div>'; setTimeout(function () { location.href = "/login.html"; }, 1500); })
      .catch(function (err) { msg.innerHTML = '<div class="alert alert-error">' + V.esc(err.message) + "</div>"; V.carregando(btn, false); });
  };
})();
</script>
</body>
</html>
