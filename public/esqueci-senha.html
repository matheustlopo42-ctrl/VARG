<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — VARG</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/lobovinho-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/varg.css">
</head>
<body>
<div id="topo"></div>
<main class="auth-wrap">
  <form class="auth-card" id="form" novalidate>
    <h1>Recuperar senha</h1>
    <p class="sub">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
    <div id="msg"></div>
    <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="email" required></div>
    <button class="btn btn-primary btn-block" id="btn" type="submit">Enviar link</button>
    <p class="foot"><a href="/login.html">Voltar para o login</a></p>
  </form>
</main>
<div id="rodape"></div>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-loja.js"></script>
<script src="/js/app.js"></script>
<script src="/js/i18n-init.js"></script>
<script>
(function () {
  var V = VARG;
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var btn = document.getElementById("btn"), msg = document.getElementById("msg"); V.carregando(btn, true);
    V.api("/api/auth/esqueci-senha", { body: { email: email.value } })
      .then(function (d) { msg.innerHTML = '<div class="alert alert-ok">' + V.esc(d.mensagem) + "</div>"; })
      .catch(function (err) { msg.innerHTML = '<div class="alert alert-error">' + V.esc(err.message) + "</div>"; })
      .finally(function () { V.carregando(btn, false); });
  };
})();
</script>
</body>
</html>
