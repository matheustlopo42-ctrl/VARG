<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta — VARG</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/lobovinho-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/varg.css">
</head>
<body>
<div id="topo"></div>
<main class="auth-wrap">
  <form class="auth-card" id="form" novalidate>
    <h1>Criar conta</h1>
    <p class="sub">Entre para a matilha. Leva menos de um minuto.</p>
    <div id="msg"></div>
    <div class="field"><label for="nome">Nome completo</label><input class="input" id="nome" autocomplete="name" required></div>
    <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="senha">Senha <span class="dim">(mínimo 8 caracteres)</span></label><input class="input" id="senha" type="password" autocomplete="new-password" minlength="8" required></div>
    <label class="check" style="margin-bottom:16px"><input type="checkbox" id="termos"> <span>Li e aceito os <a href="/termos-de-uso.html" target="_blank" style="text-decoration:underline">termos de uso</a> e a <a href="/politica-privacidade.html" target="_blank" style="text-decoration:underline">política de privacidade</a>.</span></label>
    <button class="btn btn-primary btn-block" id="btn" type="submit">Criar conta</button>
    <p class="foot">Já tem conta? <a href="#" id="linkLogin">Entrar</a></p>
  </form>
</main>
<div id="rodape"></div>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-loja.js"></script>
<script src="/js/app.js"></script>
<script src="/js/i18n-init.js"></script>
<script>
(function () {
  var V = VARG, voltar = V.param("voltar") || "/conta.html";
  if (!/^\/[^\/]/.test(voltar)) voltar = "/conta.html";
  document.getElementById("linkLogin").href = "/login.html?voltar=" + encodeURIComponent(voltar);
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var msg = document.getElementById("msg");
    if (!termos.checked) { msg.innerHTML = '<div class="alert alert-error">Aceite os termos para continuar.</div>'; return; }
    var btn = document.getElementById("btn"); V.carregando(btn, true);
    V.api("/api/auth/cadastro", { body: { nome: nome.value, email: email.value, senha: senha.value } })
      .then(function (d) { V.Sessao.salvar(d.token, d.usuario); location.href = voltar; })
      .catch(function (err) { msg.innerHTML = '<div class="alert alert-error">' + V.esc(err.message) + "</div>"; V.carregando(btn, false); });
  };
})();
</script>
</body>
</html>
