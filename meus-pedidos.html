<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pedidos - VARG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 1px solid #222; }
    nav ul { list-style: none; display: flex; gap: 25px; }
    nav ul li a { color: #fff; font-weight: 600; text-decoration: none; transition: 0.3s; }
    nav ul li a:hover { color: #DC143C; }
    .sair-btn { color: #DC143C !important; }
    .main { max-width: 900px; margin: 0 auto; padding: 100px 20px 40px; }
    h2 { color: #00BFFF; margin-bottom: 25px; font-size: 1.8em; }
    .pedido-card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
    .pedido-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; }
    .pedido-id { color: #00BFFF; font-weight: bold; font-size: 0.9em; }
    .pedido-data { color: #888; font-size: 0.85em; }
    .pedido-status { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
    .status-pago { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid #00ff88; }
    .status-pendente { background: rgba(255,165,0,0.15); color: orange; border: 1px solid orange; }
    .pedido-itens { margin-bottom: 15px; }
    .pedido-item { display: flex; justify-content: space-between; padding: 8px 0; color: #ccc; font-size: 0.9em; border-bottom: 1px solid #222; }
    .pedido-item:last-child { border-bottom: none; }
    .pedido-total { text-align: right; color: #DC143C; font-weight: bold; font-size: 1.1em; }
    .pedido-entrega { background: #111; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 0.85em; color: #aaa; }
    .pedido-entrega strong { color: #00BFFF; display: block; margin-bottom: 5px; }
    .vazio { text-align: center; padding: 60px 20px; color: #555; }
    .vazio i { font-size: 4em; margin-bottom: 20px; display: block; }
    .vazio a { color: #00BFFF; text-decoration: none; }
    .spinner { text-align: center; padding: 60px; color: #555; font-size: 1.1em; }
    .erro { text-align: center; padding: 40px; color: #ff4d4d; }
    .busca { margin-bottom: 20px; }
    .busca input { width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 0.95em; outline: none; }
    .busca input:focus { border-color: #00BFFF; }
    .busca input::placeholder { color: #555; }
  </style>
  <style>
    header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 1px solid #222; }
    nav ul { list-style: none; display: flex; gap: 25px; align-items: center; flex-wrap: wrap; }
    nav ul li a { color: #fff; font-weight: 600; text-decoration: none; transition: 0.3s; font-size: 15px; }
    nav ul li a:hover { color: #DC143C; }
    nav ul li { position: relative; }
    .dropdown-content { display: none; position: absolute; top: 100%; left: 0; background-color: #111; min-width: 180px; border: 1px solid #333; border-radius: 4px; box-shadow: 0 8px 16px rgba(0,0,0,0.6); list-style: none; padding: 0; }
    .dropdown-content li a { padding: 12px 15px; font-size: 0.9em; border-bottom: 1px solid #222; display: block; }
    nav ul li:hover .dropdown-content { display: block; }
    .cart-icon { color: #00BFFF; font-size: 1.4rem; cursor: pointer; }
  </style>


<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--red:#DC143C;--red2:#b01030}
header.slim{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.97);border-bottom:3px solid var(--red);box-shadow:0 2px 20px rgba(220,20,60,.2)}
.slim-inner{max-width:1200px;margin:0 auto;padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.slim-logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.slim-logo img{height:36px;width:36px;object-fit:contain;filter:brightness(1.8) contrast(1.3)}
.slim-logo span{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.04em;color:#DC143C;line-height:1;white-space:nowrap}
.slim-right{display:flex;align-items:center;gap:10px}
.slim-back{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:#aaa;text-decoration:none;padding:5px 10px;border-radius:6px;transition:all .2s;white-space:nowrap}
.slim-back:hover{color:#fff;background:rgba(255,255,255,.07)}
body{padding-top:59px}
</style>

<style>header:not(.slim){display:none!important}body{padding-top:59px!important}</style>
</head>
<body>
<header class="slim">
  <div class="slim-inner">
    <a href="/index.html" class="slim-logo">
      <img src="/img/lobovinho-removebg-preview.png" alt="VARG"/>
      <span>VARG</span>
    </a>
    <div class="slim-right">
      <a href="/index.html" class="slim-back" data-i18n="nav.home">← Loja</a>
    </div>
  </div>
</header>
<script src="/i18n.js"></script>
<script src="/i18n-init.js"></script>

<script src="/i18n-init.js"></script>
<script>
// ===== AUTH =====
(function(){
  var nome=localStorage.getItem('usuarioNome');
  var a=document.getElementById('hdrAuthArea');
  var m=document.getElementById('hdrMobAuth');
  if(nome){
    a.innerHTML='<a href="/meus-pedidos.html" style="color:#ccc;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:.78rem;text-transform:uppercase;text-decoration:none;white-space:nowrap;padding:4px 7px;border-radius:6px;transition:.2s;" onmouseover="this.style.color=\'#DC143C\'" onmouseout="this.style.color=\'#ccc\'" data-i18n="nav.orders">Pedidos</a>'
      +'<a href="#" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.href=\'/index.html\';" style="color:#DC143C;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:.78rem;text-transform:uppercase;text-decoration:none;white-space:nowrap;padding:4px 7px;" data-i18n="nav.logout">Sair</a>';
    if(m) m.innerHTML='<a href="/meus-pedidos.html" style="background:none;border:1px solid #333;color:#eee;" data-i18n="nav.orders">Pedidos</a><a href="#" onclick="localStorage.removeItem(\'usuarioNome\');location.href=\'/index.html\';" style="background:#DC143C;color:#fff;" data-i18n="nav.logout">Sair</a>';
  } else {
    a.innerHTML='<a href="/login.html" class="hdr-btn-login" data-i18n="nav.login">Login</a><a href="/cadastro.html" class="hdr-btn-cadastro" data-i18n="nav.register">Cadastrar</a>';
    if(m) m.innerHTML='<a href="/login.html" style="background:none;border:1px solid #333;color:#eee;">Login</a><a href="/cadastro.html" style="background:#DC143C;color:#fff;">Cadastrar</a>';
  }
})();
// ===== BUSCA =====
var VARG_CAT=[
  {id:'varg-salt',nome:'VARG Salt 30g',cat:'Smelling Salt',preco:2.00,img:'/img/smelling.png'},
  {id:'camiseta-preta-branco',nome:'Camiseta VARG preta com logo branco',cat:'Camiseta',preco:89.90,img:'/img/1.png'},
  {id:'camiseta-preta-azul',nome:'Camiseta VARG preta com logo azul',cat:'Camiseta',preco:89.90,img:'/img/2.png'},
  {id:'camiseta-branca-preto',nome:'Camiseta VARG branca com logo preto',cat:'Camiseta',preco:89.90,img:'/img/3.png'},
  {id:'camiseta-preta-dourado',nome:'Camiseta VARG preta com logo dourado',cat:'Camiseta',preco:89.90,img:'/img/4.png'},
  {id:'camiseta-azul-branco',nome:'Camiseta VARG azul marinho com logo branco',cat:'Camiseta',preco:89.90,img:'/img/5.png'}
];
function hdrBuscar(q){
  var box=document.getElementById('hdrSuggestions');
  if(!q.trim()){box.style.display='none';return;}
  var r=VARG_CAT.filter(function(p){return p.nome.toLowerCase().includes(q.toLowerCase());});
  if(!r.length){box.innerHTML='<div style="padding:14px;text-align:center;color:#666;font-size:.85rem">Nenhum produto encontrado</div>';box.style.display='block';return;}
  box.innerHTML=r.map(function(p){
    var hl=p.nome.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
    return '<div class="hdr-sugg-item" onclick="hdrIrProduto(\''+p.id+'\')"><img src="'+p.img+'" alt=""><div style="flex:1"><div class="hdr-sugg-name">'+hl+'</div><div class="hdr-sugg-cat">'+p.cat+'</div></div><span class="hdr-sugg-price">R$ '+p.preco.toFixed(2).replace('.',',')+'</span></div>';
  }).join('');
  box.style.display='block';
}
function hdrIrProduto(id){
  document.getElementById('hdrSuggestions').style.display='none';
  document.getElementById('hdrSearchInput').value='';
  window.location.href='/index.html#card-'+id;
}
document.addEventListener('click',function(e){if(!e.target.closest('.hdr-search-wrap')) document.getElementById('hdrSuggestions').style.display='none';});
// ===== MOBILE =====
function hdrToggleMob(){var m=document.getElementById('hdrMobMenu'),o=document.getElementById('hdrMobOverlay'),h=document.getElementById('hdrHamburger');m.classList.toggle('open');o.classList.toggle('open');h.classList.toggle('open');}
</script>
    

  <div class="main">
    <h2><i class="fa-solid fa-box" style="margin-right:10px;"></i>Meus Pedidos</h2>

    <div class="busca">
      <input type="text" id="busca" placeholder="🔍 Buscar por ID do pedido..." oninput="filtrar()" />
    </div>

    <div id="listaPedidos">
      <div class="spinner"><i class="fa-solid fa-spinner fa-spin"></i> Carregando pedidos...</div>
    </div>
  </div>

  <script>
    const nome = localStorage.getItem('usuarioNome');
    const email = localStorage.getItem('usuarioEmail');

    if (!nome) {
      window.location.href = '/login.html';
    } else {
      document.getElementById('userName').textContent = nome;
    }

    document.getElementById('btnSair').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('usuarioNome');
      localStorage.removeItem('usuarioEmail');
      window.location.href = '/login.html';
    });

    const formatPrice = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
    let todosPedidos = [];

    async function carregarPedidos() {
      try {
        const res = await fetch('/api/pedidos');
        const todos = await res.json();

        // Filtra apenas pedidos deste usuário pelo email ou nome
        todosPedidos = todos.filter(p =>
          (email && p.cliente_email && p.cliente_email.toLowerCase() === email.toLowerCase()) ||
          (nome && p.cliente_nome && p.cliente_nome.toLowerCase() === nome.toLowerCase())
        ).filter(p => p.status === 'pago');

        renderizarPedidos(todosPedidos);
      } catch (err) {
        document.getElementById('listaPedidos').innerHTML = `<div class="erro"><i class="fa-solid fa-circle-exclamation"></i> Erro ao carregar pedidos. Tente novamente.</div>`;
      }
    }

    function renderizarPedidos(pedidos) {
      const container = document.getElementById('listaPedidos');
      if (pedidos.length === 0) {
        container.innerHTML = `
          <div class="vazio">
            <i class="fa-solid fa-box-open"></i>
            <p>Você ainda não tem pedidos.</p>
            <p style="margin-top:10px;"><a href="/index.html">Ir às compras →</a></p>
          </div>`;
        return;
      }

      container.innerHTML = pedidos.map(p => {
        let itens = [];
        try { itens = JSON.parse(p.itens || '[]'); } catch(e) {}

        let entrega = null;
        try { entrega = p.entrega ? JSON.parse(p.entrega) : null; } catch(e) {}

        const itensHtml = itens.length > 0
          ? itens.map(i => `<div class="pedido-item"><span>${i.quantidade}x ${i.nome}</span><span>${formatPrice(i.preco * i.quantidade)}</span></div>`).join('')
          : `<div class="pedido-item"><span>Produto VARG</span><span>${formatPrice(p.valor)}</span></div>`;

        const entregaHtml = entrega
          ? `<div class="pedido-entrega"><strong><i class="fa-solid fa-truck"></i> Endereço de Entrega</strong>${entrega.rua}, ${entrega.numero}${entrega.complemento ? ' ' + entrega.complemento : ''} — ${entrega.bairro}, ${entrega.cidade}/${entrega.estado} — CEP: ${entrega.cep}</div>`
          : '';

        const envioStatusHtml = p.status_envio === 'enviado' && p.codigo_rastreio
          ? `<div class="pedido-entrega" style="border-left-color:#00BFFF;margin-top:10px;">
               <strong style="color:#00BFFF;"><i class="fa-solid fa-box"></i> Envio</strong>
               <span style="color:#00ff88;font-weight:bold;">✅ Enviado</span><br>
               <span>Código de rastreio: <b style="color:#fff;">${p.codigo_rastreio}</b></span><br>
               <a href="https://rastreamento.correios.com.br/app/index.php?numero=${p.codigo_rastreio}" target="_blank" style="color:#00BFFF;font-size:0.9em;">🔍 Rastrear nos Correios →</a>
             </div>`
          : p.status === 'pago'
            ? `<div class="pedido-entrega" style="margin-top:10px;">
                 <strong><i class="fa-solid fa-box"></i> Envio</strong>
                 <span style="color:orange;">⏳ Aguardando envio</span>
               </div>`
            : '';

        return `
          <div class="pedido-card">
            <div class="pedido-header">
              <div>
                <div class="pedido-id"># ${p.external_id || p.payment_id?.slice(0,16) || '—'}</div>
                <div class="pedido-data">${new Date(p.criado_em).toLocaleString('pt-BR')}</div>
              </div>
              <span class="pedido-status status-${p.status}">${p.status === 'pago' ? '✅ Pago' : '⏳ Pendente'}</span>
            </div>
            <div class="pedido-itens">${itensHtml}</div>
            <div class="pedido-total">Total: ${formatPrice(p.valor)}</div>
            ${entregaHtml}
            ${envioStatusHtml}
          </div>`;
      }).join('');
    }

    function filtrar() {
      const termo = document.getElementById('busca').value.toLowerCase();
      const filtrados = todosPedidos.filter(p =>
        (p.external_id || '').toLowerCase().includes(termo) ||
        (p.payment_id || '').toLowerCase().includes(termo)
      );
      renderizarPedidos(filtrados);
    }

    carregarPedidos();
  </script>
  
</body>
</html>
