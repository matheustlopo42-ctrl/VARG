<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VARG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle at center, rgba(220,20,60,0.08), transparent 35%); }
    .container { width: 100%; max-width: 380px; background: rgba(20,20,20,0.95); border: 1px solid #333; border-radius: 16px; padding: 40px 30px; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { font-size: 2rem; text-transform: uppercase; color: #DC143C; letter-spacing: 4px; }
    .logo p { color: #666; font-size: 0.85rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .input-group input { width: 100%; padding: 14px 16px; border: 1px solid #333; border-radius: 10px; background: #111; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; letter-spacing: 2px; }
    .input-group input:focus { border-color: #DC143C; box-shadow: 0 0 10px rgba(220,20,60,0.2); }
    .btn { width: 100%; background: #DC143C; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; letter-spacing: 1px; text-transform: uppercase; }
    .btn:hover { background: #b01030; }
    .btn:disabled { background: #444; cursor: not-allowed; }
    .erro { color: #ff4d4d; text-align: center; margin-top: 15px; font-size: 0.9rem; display: none; background: rgba(255,77,77,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,77,77,0.3); }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #555; text-decoration: none; font-size: 0.85rem; }
    .back a:hover { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>VARG</h1>
      <p>Painel Administrativo</p>
    </div>
    <div class="input-group">
      <label>Senha de Acesso</label>
      <input type="password" id="senha" placeholder="••••••••••••" />
    </div>
    <button class="btn" id="btnEntrar">Entrar</button>
    <div class="erro" id="erroMsg"></div>
    <div class="back"><a href="/index.html">← Voltar ao site</a></div>
  </div>

  <script>
    document.getElementById('btnEntrar').addEventListener('click', entrar);
    document.getElementById('senha').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') entrar();
    });

    async function entrar() {
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btnEntrar');
      const erro = document.getElementById('erroMsg');
      erro.style.display = 'none';

      if (!senha) { erro.textContent = 'Digite a senha.'; erro.style.display = 'block'; return; }

      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const res = await fetch('/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = '/admin?token=' + data.token;
        } else {
          erro.textContent = data.message || 'Senha incorreta.';
          erro.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      } catch(err) {
        erro.textContent = 'Erro ao conectar com o servidor.';
        erro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
