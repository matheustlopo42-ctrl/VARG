    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(to right, #8B0000, #00008B);
            padding: 1.5rem 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.4);
        }
        header h1 { font-size: 2.5rem; letter-spacing: 0.2em; text-transform: uppercase; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .profile-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,0,0,0.2);
            max-width: 450px;
            width: 100%;
            transition: transform 0.3s ease;
        }
        .profile-card:hover { transform: translateY(-5px); }
        .page-title { font-size: 2rem; margin-bottom: 2rem; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .user-icon {
            width: 140px; height: 140px;
            background: linear-gradient(135deg, #ff4500, #4169e1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem;
            font-size: 5rem;
            box-shadow: 0 15px 35px rgba(255,69,0,0.4);
            border: 4px solid rgba(255,255,255,0.2);
        }
        .info { margin-bottom: 2.5rem; }
        .info div { margin: 1.2rem 0; text-align: left; }
        .info label { display: block; font-size: 0.95rem; color: #ff6b6b; font-weight: bold; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .info span { display: block; font-size: 1.3rem; color: #ffffff; font-weight: 500; }
        .status-badge { display: inline-block; background: linear-gradient(135deg, #dc3545, #ff4500); color: white; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.95rem; font-weight: bold; box-shadow: 0 4px 15px rgba(220,53,69,0.4); }
        .buttons { display: flex; gap: 1rem; }
        button { flex: 1; padding: 1.2rem 1.5rem; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-pedidos { background: linear-gradient(135deg, #007bff, #0056b3); color: white; box-shadow: 0 8px 20px rgba(0,123,255,0.4); }
        .btn-sair { background: linear-gradient(135deg, #dc3545, #c82333); color: white; box-shadow: 0 8px 20px rgba(220,53,69,0.4); }
        button:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.4); }
        .nao-logado { text-align: center; }
        .nao-logado p { color: #aaa; margin-bottom: 1.5rem; }
        .btn-login { background: linear-gradient(135deg, #dc3545, #c82333); color: white; display: inline-block; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1rem; }
        @media (max-width: 480px) {
            header h1 { font-size: 2rem; }
            .profile-card { padding: 2rem 1.5rem; margin: 1rem; }
            .page-title { font-size: 1.6rem; }
            .user-icon { width: 110px; height: 110px; font-size: 4rem; }
            .buttons { flex-direction: column; }
        }

<style>
.slim-cart-btn{position:relative;background:none;border:1px solid #333;border-radius:10px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:#ccc;transition:all .2s;white-space:nowrap}

.slim-cart-count{background:#DC143C;color:#fff;border-radius:50%;width:18px;height:18px;font-size:.6rem;font-weight:800;display:none;align-items:center;justify-content:center;margin-left:2px}
.slim-cart-count.show{display:flex}
/* CART DRAWER */
.slim-cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.slim-cart-overlay.open{opacity:1;pointer-events:all}
.slim-cart-drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:95vw;background:#111;z-index:2001;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.5)}

.slim-cart-head{padding:18px 22px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between}
.slim-cart-head h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.3rem;text-transform:uppercase;color:#fff}
.slim-cart-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888;line-height:1}
.slim-cart-close:hover{color:#DC143C}
.slim-cart-items{flex:1;overflow-y:auto;padding:14px 22px}
.slim-cart-foot{padding:18px 22px;border-top:1px solid #333;background:#0f0f0f}

.slim-btn-checkout{display:block;width:100%;padding:13px;background:#DC143C;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;transition:.2s}
.slim-btn-checkout:hover{background:#b01030}
.slim-btn-limpar{display:block;text-align:center;margin-top:8px;font-size:.8rem;color:#555;cursor:pointer;background:none;border:none;text-decoration:underline}
.slim-btn-limpar:hover{color:#DC143C}
</style>

function hdrBuscar(q){
  var box=document.getElementById('hdrSuggestions');
  if(!q.trim()){box.style.display='none';return;}
  var r=VARG_CAT.filter(function(p){return p.nome.toLowerCase().includes(q.toLowerCase());});
  if(!r.length){box.innerHTML='<div style="padding:14px;text-align:center;color:#666;font-size:.85rem">Nenhum produto encontrado</div>';box.style.display='block';return;}
  box.innerHTML=r.map(function(p){
    var hl=p.nome.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
    return '<div class="hdr-sugg-item" onclick="hdrIrProduto(\''+p.id+'\')"><img src="'+p.img+'" alt=""><div style="flex:1"><div class="hdr-sugg-name">'+hl+'</div><div class="hdr-sugg-cat">'+p.cat+'</div></div><span class="hdr-sugg-price">R$ '+p.preco.toFixed(2).replace('.',',')+'</span></div>';
  }).join('');
  box.style.display='block';
}
function hdrIrProduto(id){
  document.getElementById('hdrSuggestions').style.display='none';
  document.getElementById('hdrSearchInput').value='';
  window.location.href='/index.html#card-'+id;
}
document.addEventListener('click',function(e){if(!e.target.closest('.hdr-search-wrap')) document.getElementById('hdrSuggestions').style.display='none';});

<script>
function slimAbrirCart(){document.getElementById('slimCartDrawer').classList.add('open');document.getElementById('slimCartOverlay').classList.add('open');document.body.style.overflow='hidden';slimRenderCart();}
function slimFecharCart(){document.getElementById('slimCartDrawer').classList.remove('open');document.getElementById('slimCartOverlay').classList.remove('open');document.body.style.overflow='';}
function slimLimparCart(){localStorage.removeItem('carrinho');slimRenderCart();}
function slimChgQty(nome,d){var c=JSON.parse(localStorage.getItem('carrinho')||'[]');var i=c.find(function(x){return x.nome===nome;});if(i){i.quantidade+=d;if(i.quantidade<=0)c=c.filter(function(x){return x.nome!==nome;});}localStorage.setItem('carrinho',JSON.stringify(c));slimRenderCart();}
function slimRmItem(nome){var c=JSON.parse(localStorage.getItem('carrinho')||'[]').filter(function(x){return x.nome!==nome;});localStorage.setItem('carrinho',JSON.stringify(c));slimRenderCart();}
function slimRenderCart(){
  var items=document.getElementById('slimCartItems');
  var foot=document.getElementById('slimCartFoot');
  var badge=document.getElementById('slimCartBadge');
  var cart=JSON.parse(localStorage.getItem('carrinho')||'[]');
  if(!cart.length){
    if(items) items.innerHTML='<p style="color:#555;text-align:center;padding:40px 0;font-size:.9rem">Carrinho vazio.</p>';
    if(foot) foot.style.display='none';
    if(badge) badge.classList.remove('show');
    return;
  }
  var total=0,html='<div style="display:flex;flex-direction:column;gap:12px">';
  cart.forEach(function(item){
    var sub=item.preco*item.quantidade; total+=sub;
    html+='<div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;padding-bottom:12px">'
      +'<img src="'+item.img+'" style="width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid #333">'
      +'<div style="flex:1;min-width:0"><div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:.9rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+item.nome+'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'
      +'<button onclick="slimChgQty(\''+item.nome.replace(/'/g,"\'")+'\', -1)" style="background:#333;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.85rem">−</button>'
      +'<span style="color:#fff;font-size:.88rem">'+item.quantidade+'</span>'
      +'<button onclick="slimChgQty(\''+item.nome.replace(/'/g,"\'")+'\', 1)" style="background:#333;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.85rem">+</button>'
      +'<button onclick="slimRmItem(\''+item.nome.replace(/'/g,"\'")+'\');" style="background:none;border:none;color:#555;cursor:pointer;margin-left:auto;font-size:.9rem">🗑</button>'
      +'</div>'
      +'<span style="color:#DC143C;font-weight:700;font-size:.82rem;font-family:\'Barlow Condensed\',sans-serif">R$ '+sub.toFixed(2).replace('.',',')+'</span>'
      +'</div></div>';
  });
  html+='</div>';
  if(items) items.innerHTML=html;
  if(document.getElementById('slimCartTotal')) document.getElementById('slimCartTotal').textContent='R$ '+total.toFixed(2).replace('.',',');
  if(foot) foot.style.display='';
  if(badge){badge.textContent=cart.reduce(function(a,i){return a+i.quantidade;},0);badge.classList.add('show');}
}
document.addEventListener('DOMContentLoaded', slimRenderCart);
</script>

      if (nome) {
        a.innerHTML =
          '<a href="/meus-pedidos.html" style="' + s + 'color:#ccc;" onmouseover="this.style.color=\'#DC143C\'" onmouseout="this.style.color=\'#ccc\'">' + t('nav.orders') + '</a>' +
          '<a href="#" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.href=\'/index.html\';" style="' + s + 'color:#DC143C;">' + t('nav.logout') + '</a>';
      } else {
        a.innerHTML =
          '<a href="/login.html" style="' + s + 'color:#DC143C;border:1px solid #DC143C;border-radius:8px;">' + t('nav.login') + '</a>' +
          '<a href="/cadastro.html" style="' + s + 'background:#DC143C;color:#fff;border-radius:8px;">' + t('nav.register') + '</a>';
      }
    }

    // ---- AUTH AREA (index desktop) ----
    var a2 = document.getElementById('authArea');
    if (a2) {
      var s2 = "font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.82rem;text-transform:uppercase;text-decoration:none;white-space:nowrap;padding:4px 7px;border-radius:6px;transition:.2s;";
      if (nome) {
        a2.innerHTML =
          '<a href="/meus-pedidos.html" style="' + s2 + 'color:#ccc;" onmouseover="this.style.color=\'#DC143C\'" onmouseout="this.style.color=\'#ccc\'">' + t('nav.orders') + '</a>' +
          '<a href="#" id="btnSair" style="' + s2 + 'color:#DC143C;">' + t('nav.logout') + '</a>';
        var bs = document.getElementById('btnSair');
        if (bs) bs.onclick = function(e) { e.preventDefault(); localStorage.removeItem('usuarioNome'); localStorage.removeItem('usuarioEmail'); window.location.reload(); };
      } else {
        a2.innerHTML =
          '<a href="/login.html" class="btn-login" style="' + s2 + '">' + t('nav.login') + '</a>' +
          '<a href="/cadastro.html" class="btn-cadastro" style="' + s2 + '">' + t('nav.register') + '</a>';
      }
    }

    // ---- MOBILE AUTH (index) ----
    var m = document.getElementById('mobileAuth');
    if (m) {
      if (nome) {
        m.innerHTML =
          '<a href="/meus-pedidos.html" class="btn-login">' + t('nav.orders') + '</a>' +
          '<a href="#" class="btn-cadastro" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.reload();">' + t('nav.logout') + '</a>';
      } else {
        m.innerHTML =
          '<a href="/login.html" class="btn-login">' + t('nav.login') + '</a>' +
          '<a href="/cadastro.html" class="btn-cadastro">' + t('nav.register') + '</a>';
      }
    }

    // ---- SLIM MOBILE AUTH (páginas secundárias) ----
    var sm = document.getElementById('slimMobAuth');
    if (sm) {
      if (nome) {
        sm.innerHTML =
          '<a href="/meus-pedidos.html" class="sm-login">' + t('nav.orders') + '</a>' +
          '<a href="#" class="sm-reg" onclick="localStorage.removeItem(\'usuarioNome\');localStorage.removeItem(\'usuarioEmail\');location.href=\'/index.html\';">' + t('nav.logout') + '</a>';
      } else {
        sm.innerHTML = '<a href="/login.html" class="sm-login">' + t('nav.login') + '</a><a href="/cadastro.html" class="sm-reg">' + t('nav.register') + '</a>';
      }
    }

    // ← Loja traduzido
    document.querySelectorAll('.slim-back').forEach(function(el) {
      el.textContent = '← ' + t('nav.home');
    });
  }

  // Aguarda dicionário i18n
  if (window.PEPMASTERS_I18N) {
    renderAuth();
  } else {
    var tries = 0;
    var iv = setInterval(function() {
      tries++;
      if (window.PEPMASTERS_I18N) { clearInterval(iv); renderAuth(); }
      else if (tries > 40) clearInterval(iv);
    }, 50);
  }

  // Reaplica quando idioma muda
  document.addEventListener('vargLangChanged', renderAuth);
document.addEventListener('vargLangChanged', function() { if(window.PEP_LANG_APPLY) window.PEP_LANG_APPLY(); });
})();
</script>
</body>
</html>
