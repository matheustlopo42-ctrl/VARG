<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Lobo - VARG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(to right, #8B0000, #00008B);
            padding: 1.5rem 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.4);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .user-icon {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ff4500, #4169e1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 5rem;
            box-shadow: 0 15px 35px rgba(255, 69, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.2);
        }

        .info {
            margin-bottom: 2.5rem;
        }

        .info div {
            margin: 1.2rem 0;
            text-align: left;
        }

        .info label {
            display: block;
            font-size: 0.95rem;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info span {
            display: block;
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc3545, #ff4500);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .buttons {
            display: flex;
            gap: 1rem;
        }

        button {
            flex: 1;
            padding: 1.2rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-edit {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4);
        }

        .btn-sair {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 2rem;
            }

            .profile-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .page-title {
                font-size: 1.6rem;
            }

            .user-icon {
                width: 110px;
                height: 110px;
                font-size: 4rem;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>VARG</h1>
    </header>

    <main>
        <div class="profile-card">
            <h2 class="page-title">Área do Lobo</h2>
            <div class="user-icon">🐺</div>
            <div class="info">
                <div>
                    <label>Nome</label>
                    <span>Matheusinho</span>
                </div>
                <div>
                    <label>E-mail</label>
                    <span>teste@varg.com</span>
                </div>
                <div>
                    <label>Status na Matilha</label>
                    <span>Alfa <span class="status-badge">Alfa</span></span>
                </div>
            </div>
            <div class="buttons">
                <button class="btn-edit">Editar Perfil</button>
                <button class="btn-sair">Sair</button>
            </div>
        </div>
    </main>
</body>
</html>
