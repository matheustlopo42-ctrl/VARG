<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - VARG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background-image: radial-gradient(circle at center, rgba(220,20,60,0.08), transparent 35%); }
    .container { width: 100%; max-width: 420px; background: rgba(20,20,20,0.95); border: 1px solid #222; border-radius: 16px; padding: 35px 30px; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { font-size: 2.2rem; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px rgba(220,20,60,0.35); }
    .logo p { color: #bbb; font-size: 0.95rem; margin-top: 8px; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #ddd; }
    .input-box { position: relative; }
    .input-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #DC143C; }
    .input-box input { width: 100%; padding: 14px 14px 14px 42px; border: 1px solid #333; border-radius: 10px; background: #111; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
    .input-box input:focus { border-color: #DC143C; box-shadow: 0 0 10px rgba(220,20,60,0.2); }
    .btn { width: 100%; background: #DC143C; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn:hover { background: #b01030; }
    .btn:disabled { background: #444; cursor: not-allowed; }
    .msg { text-align: center; margin-top: 15px; font-size: 0.9rem; padding: 10px; border-radius: 8px; display: none; }
    .msg.erro { color: #ff4d4d; background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3); }
    .msg.sucesso { color: #00ff88; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); }
    .voltar { text-align: center; margin-top: 20px; }
    .voltar a { color: #00BFFF; text-decoration: none; font-size: 0.95rem; }
    .voltar a:hover { color: #fff; }
    .token-invalido { text-align: center; padding: 20px; }
    .token-invalido i { font-size: 3em; color: #DC143C; display: block; margin-bottom: 15px; }
    .token-invalido p { color: #aaa; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>VARG</h1>
      <p>Redefinir senha</p>
    </div>

    <div id="formArea">
      <div class="input-group">
        <label>Nova senha</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="novaSenha" placeholder="Digite sua nova senha" />
        </div>
      </div>
      <div class="input-group">
        <label>Confirmar nova senha</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirmarSenha" placeholder="Repita a nova senha" />
        </div>
      </div>
      <button class="btn" id="btnRedefinir" onclick="redefinirSenha()">Redefinir Senha</button>
      <div class="msg erro" id="msgErro"></div>
      <div class="msg sucesso" id="msgSucesso"></div>
    </div>

    <div class="token-invalido" id="tokenInvalido" style="display:none">
      <i class="fa-solid fa-circle-xmark"></i>
      <p>Link inválido ou expirado. Solicite um novo link de redefinição.</p>
      <a href="/login.html" style="color:#DC143C;font-weight:bold;">Voltar ao Login</a>
    </div>

    <div class="voltar" id="voltarLogin">
      <a href="/login.html">← Voltar ao Login</a>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('tokenInvalido').style.display = 'block';
      document.getElementById('voltarLogin').style.display = 'none';
    }

    async function redefinirSenha() {
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmar = document.getElementById('confirmarSenha').value;
      const msgErro = document.getElementById('msgErro');
      const msgSucesso = document.getElementById('msgSucesso');
      const btn = document.getElementById('btnRedefinir');

      msgErro.style.display = 'none';
      msgSucesso.style.display = 'none';

      if (!novaSenha || !confirmar) {
        msgErro.textContent = 'Preencha todos os campos.';
        msgErro.style.display = 'block';
        return;
      }
      if (novaSenha.length < 6) {
        msgErro.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        msgErro.style.display = 'block';
        return;
      }
      if (novaSenha !== confirmar) {
        msgErro.textContent = 'As senhas não coincidem.';
        msgErro.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Redefinindo...';

      try {
        const res = await fetch('/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });
        const data = await res.json();

        if (data.success) {
          msgSucesso.textContent = '✅ Senha redefinida com sucesso! Redirecionando...';
          msgSucesso.style.display = 'block';
          document.getElementById('formArea').querySelector('.input-group').style.display = 'none';
          document.querySelectorAll('.input-group').forEach(el => el.style.display = 'none');
          btn.style.display = 'none';
          setTimeout(() => { window.location.href = '/login.html'; }, 2500);
        } else {
          msgErro.textContent = data.message || 'Erro ao redefinir senha.';
          msgErro.style.display = 'block';
          if (data.message?.includes('inválido') || data.message?.includes('expirado')) {
            document.getElementById('formArea').style.display = 'none';
            document.getElementById('tokenInvalido').style.display = 'block';
            document.getElementById('voltarLogin').style.display = 'none';
          }
          btn.disabled = false;
          btn.textContent = 'Redefinir Senha';
        }
      } catch (err) {
        msgErro.textContent = 'Erro ao conectar com o servidor.';
        msgErro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Redefinir Senha';
      }
    }
  </script>
</body>
</html>
