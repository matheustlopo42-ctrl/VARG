<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - VARG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 1px solid #222; }
    nav ul { list-style: none; display: flex; gap: 25px; }
    nav ul li a { color: #fff; font-weight: 600; text-decoration: none; transition: 0.3s; }
    nav ul li a:hover { color: #DC143C; }
    .sair-btn { color: #DC143C !important; }
    .main { max-width: 900px; margin: 0 auto; padding: 100px 20px 40px; }
    .welcome { margin-bottom: 30px; }
    .welcome h2 { font-size: 2em; color: #00BFFF; }
    .welcome p { color: #888; margin-top: 5px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 25px; border: 1px solid #333; text-align: center; cursor: pointer; transition: 0.3s; text-decoration: none; color: #fff; display: block; }
    .card:hover { border-color: #00BFFF; transform: translateY(-3px); }
    .card i { font-size: 2.5em; margin-bottom: 15px; color: #00BFFF; }
    .card h3 { font-size: 1.1em; margin-bottom: 5px; }
    .card p { color: #888; font-size: 0.85em; }
    .card.red i { color: #DC143C; }
    .card.red:hover { border-color: #DC143C; }
    .card.green i { color: #25D366; }
    .card.green:hover { border-color: #25D366; }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="/index.html">Início</a></li>
        <li><a href="#" style="color:#00BFFF;"><i class="fa-solid fa-user"></i> <span id="userName">Membro</span></a></li>
        <li><a href="#" class="sair-btn" id="btnSair">Sair</a></li>
      </ul>
    </nav>
  </header>

  <div class="main">
    <div class="welcome">
      <h2>Bem-vindo, <span id="nomeUsuario">Membro</span>! 🐺</h2>
      <p>O que você quer fazer hoje?</p>
    </div>

    <div class="cards">
      <a href="/meus-pedidos.html" class="card">
        <i class="fa-solid fa-box"></i>
        <h3>Meus Pedidos</h3>
        <p>Acompanhe suas compras</p>
      </a>
      <a href="/perfil.html" class="card">
        <i class="fa-solid fa-user"></i>
        <h3>Meu Perfil</h3>
        <p>Veja seus dados</p>
      </a>
      <a href="/rastrear-pedido.html" class="card green">
        <i class="fa-solid fa-truck"></i>
        <h3>Rastrear Pedido</h3>
        <p>Acompanhe a entrega</p>
      </a>
      <a href="/index.html" class="card red">
        <i class="fa-solid fa-bag-shopping"></i>
        <h3>Continuar Comprando</h3>
        <p>Ver produtos da loja</p>
      </a>
    </div>

    <div id="adminArea" style="display:none; margin-top:30px; padding-top:30px; border-top:1px solid #222;">
      <p style="color:#555; font-size:0.85em; margin-bottom:15px; text-transform:uppercase; letter-spacing:1px;">Área Restrita</p>
      <a href="/admin-login" style="color:#DC143C; text-decoration:none; font-size:0.9em; font-weight:bold;">
        <i class="fa-solid fa-lock" style="margin-right:6px;"></i>Painel Administrativo
      </a>
    </div>
    <div style="display:none">
    </div>
  </div>

  <script>
    const nome = localStorage.getItem('usuarioNome');
    const email = localStorage.getItem('usuarioEmail');
    if (!nome) {
      window.location.href = '/login.html';
    } else {
      document.getElementById('userName').textContent = nome;
      document.getElementById('nomeUsuario').textContent = nome;
      // Mostra área admin para emails autorizados
      const admins = ['matheustlopo42@gmail.com', 'varg.oficialstore@gmail.com', 'varg.oficial@outlook.com'];
      if (email && admins.includes(email.toLowerCase())) {
        document.getElementById('adminArea').style.display = 'block';
      }
    }

    document.getElementById('btnSair').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('usuarioNome');
      localStorage.removeItem('usuarioEmail');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
